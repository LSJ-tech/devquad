<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#142143" />
    <title>Página no encontrada | DevQuad</title>

    <link rel="icon" type="image/svg+xml" href="./devquad-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./img/favicon-16x16.png" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <link rel="stylesheet" href="style.css?v=15" />

  <body>
    <a class="skip-link" href="#main-content">Saltar al contenido principal</a>
    <header class="site-header" id="top">

          <img src="./devquad-logo-dark.svg" alt="Logo DevQuad" class="brand-logo brand-logo-dark" />

        <div class="header-actions">

            <span class="theme-toggle-thumb"></span>

        </div>
      </div>

    <main id="main-content">
      <section class="section not-found">

          <p class="error-code" aria-hidden="true">404</p>

          <a class="btn btn-primary" href="./index.html">Volver al inicio</a>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> DevQuad</p>
      </div>
    </footer>
