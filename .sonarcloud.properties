# Config file actually read by SonarCloud's Automatic Analysis
# (sonar-project.properties is ignored in that mode).

# The <head> boilerplate (favicons, fonts, manifest) is intentionally
# repeated across index.html, privacidad.html and 404.html: this is a
# small static site with no build/templating step, so per-page HTML
# duplication is expected rather than a maintainability risk.
sonar.cpd.exclusions=*.html
